# ============================================
# 云心伴 - 本地开发环境 Docker Compose
# 启动: docker-compose -f docker/docker-compose.yml up -d
# 停止: docker-compose -f docker/docker-compose.yml down
# ============================================

version: "3.8"

services:
  # ---------- PostgreSQL 14 ----------
  postgres:
    image: postgres:14-alpine
    container_name: yxb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yunxinban}
      POSTGRES_USER: ${POSTGRES_USER:-yunxinban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yunxinban_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yunxinban} -d ${POSTGRES_DB:-yunxinban}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yxb-network

  # ---------- MongoDB 6 ----------
  mongodb:
    image: mongo:6-jammy
    container_name: yxb-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-yunxinban}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-yunxinban_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-yunxinban}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yxb-network

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: yxb-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-yunxinban_dev} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - yxb-network

  # ---------- Nginx 网关（开发环境可选） ----------
  # nginx:
  #   image: nginx:alpine
  #   container_name: yxb-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - postgres
  #     - mongodb
  #     - redis
  #   networks:
  #     - yxb-network

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  yxb-network:
    driver: bridge
