# ============================================
# 云心伴 - Nginx 网关配置
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（含请求耗时）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ---------- 限流配置 ----------
    # 通用 API 限流：每个 IP 每秒 100 请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # WebSocket 连接限流
    limit_conn_zone $binary_remote_addr zone=ws_limit:10m;
    limit_conn ws_limit 5;

    # ---------- 上游服务 ----------
    upstream main_server {
        server main-server:3000;
        keepalive 32;
    }

    upstream ai_service {
        server ai-service:8000;
        keepalive 16;
    }

    # ---------- HTTP → HTTPS 重定向 ----------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS 主服务 ----------
    server {
        listen 443 ssl http2;
        server_name api.yunxinban.local;

        # SSL 证书（开发环境使用自签名证书）
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 安全头
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------- 主服务 API ----------
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://main_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # ---------- WebSocket ----------
        location /ws/ {
            proxy_pass http://main_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------- AI 服务（内部） ----------
        location /ai/ {
            # 仅允许内部服务访问
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;

            proxy_pass http://ai_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
            proxy_buffering off;  # 流式响应需要关闭缓冲
        }

        # ---------- 健康检查 ----------
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
